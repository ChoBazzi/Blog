<title id="bizkit-system-dark-title">BizKit AI 서버의 책임 경계</title>
<desc id="bizkit-system-dark-desc">클라이언트와 Spring 도메인 서버의 요청을 FastAPI가 접수하고 Redis Streams의 작업을 Worker가 실행하며, 외부 데이터·RunPod·임베딩 서비스를 활용한 결과를 파싱해 Redis Hash에 기록하고 FastAPI가 조회 응답을 제공한다.</desc>
