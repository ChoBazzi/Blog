<title id="home-server-after-dark-title">Proxmox에서 NAS와 앱 실행 환경 분리</title>
<desc id="home-server-after-dark-desc">Proxmox 아래에 Xpenology NAS VM과 Docker Host를 분리하고 Web과 API를 Docker에서 운영하는 방향이며, 데이터베이스는 Docker 또는 별도 LXC 배치를 검토 중이다.</desc>
