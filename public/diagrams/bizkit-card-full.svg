<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bizkit-card-full-title bizkit-card-full-desc" id="bizkit-card-full-root">
<title id="bizkit-card-full-title">명함 배경 생성과 텍스트 렌더링의 분리</title>
<desc id="bizkit-card-full-desc">스타일 요청을 프롬프트와 레이아웃으로 구성하고 SDXL로 배경을 생성한 뒤, 별도 렌더링 단계에서 이름과 연락처를 배치한다.</desc>
<defs>
      <style>#bizkit-card-full-root { color: #1f2328; font-family: 'NanumSquare', 'NanumSquare Neo', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif; }
      #bizkit-card-full-root .diagram-container { width:100%;overflow-x:auto }
      #bizkit-card-full-root .diagram-container { overflow-x:visible }</style>
