<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vllm-routing-title vllm-routing-desc" id="vllm-routing-root">
<title id="vllm-routing-title">요청 형식에 따라 나누는 vLLM 엔진</title>
<desc id="vllm-routing-desc">RunPod handler가 JobInput을 파싱하고 OpenAI route 여부에 따라 vLLMEngine 또는 OpenAIvLLMEngine을 선택한 뒤 AsyncLLM으로 생성하고 streaming 또는 non-streaming 응답을 반환한다.</desc>
<defs>
      <style>#vllm-routing-root { color: #1f2328; font-family: 'NanumSquare', 'NanumSquare Neo', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif; }
      #vllm-routing-root .diagram-container { width:100%;overflow-x:auto }
      #vllm-routing-root .diagram-container { overflow-x:visible }</style>
