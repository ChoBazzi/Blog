<title id="bizkit-async-dark-title">요청 접수와 모델 실행의 분리</title>
<desc id="bizkit-async-dark-desc">FastAPI가 작업을 접수하면 Redis Streams와 Worker가 모델 호출·후처리를 수행하고, 클라이언트는 작업 ID로 상태와 결과를 조회한다.</desc>
<defs>
