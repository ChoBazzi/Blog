<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="home-server-before-full-title home-server-before-full-desc" id="home-server-before-full-root">
<title id="home-server-before-full-title">DSM 하나에 집중됐던 서비스 기반</title>
<desc id="home-server-before-full-desc">기존 Intel J5040 하드웨어 위에서 Xpenology와 DSM이 Docker를 실행하고 Web, API, 데이터베이스가 그 위에 의존하므로 DSM 장애가 전체 서비스 접근에 영향을 주었다.</desc>
