<title id="church-v2-full-title">성당 앱 v2: 콘텐츠와 파일의 책임 분리</title>
<desc id="church-v2-full-desc">v2 설계 방향에서 React Native App은 Spring Boot API를 조회하고, Spring은 PostgreSQL의 콘텐츠·파일 메타데이터와 별도 File Storage의 PDF·이미지 파일을 관리한다.</desc>
