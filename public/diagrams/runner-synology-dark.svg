<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runner-synology-dark-title runner-synology-dark-desc" id="runner-synology-dark-root">
<title id="runner-synology-dark-title">NAS에서 GitHub로 연결하는 Runner</title>
<desc id="runner-synology-dark-desc">Runner 컨테이너가 GitHub로 outbound HTTPS 443 연결을 만들고 작업을 받아 Docker socket으로 Synology Docker Engine 20.10.3 및 API 1.41을 사용하며 임시 PostgreSQL 17.10 CI 데이터베이스를 실행한다.</desc>
<defs>
      <style>#runner-synology-dark-root { color: #f3f6fb; font-family: 'NanumSquare', 'NanumSquare Neo', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif; }
      #runner-synology-dark-root .diagram-container { width:100%;overflow-x:auto }
      #runner-synology-dark-root .diagram-container { overflow-x:visible }</style>
