<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Default blog cover</title>
  <desc id="desc">A default cover image for posts without a custom preview image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#f8fafc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1010" cy="130" r="220" fill="#38bdf8" opacity="0.16"/>
  <circle cx="150" cy="590" r="260" fill="#f59e0b" opacity="0.12"/>
  <rect x="155" y="155" width="890" height="365" rx="28" fill="url(#panel)" stroke="#f8fafc" stroke-opacity="0.18"/>
  <rect x="205" y="215" width="270" height="24" rx="12" fill="#67e8f9" opacity="0.9"/>
  <rect x="205" y="275" width="590" height="18" rx="9" fill="#e2e8f0" opacity="0.82"/>
  <rect x="205" y="322" width="700" height="18" rx="9" fill="#cbd5e1" opacity="0.56"/>
  <rect x="205" y="369" width="515" height="18" rx="9" fill="#cbd5e1" opacity="0.42"/>
  <g transform="translate(770 252)">
    <rect x="0" y="0" width="190" height="150" rx="20" fill="#020617" opacity="0.42" stroke="#f8fafc" stroke-opacity="0.18"/>
    <path d="M42 48h106M42 78h78M42 108h118" stroke="#67e8f9" stroke-width="12" stroke-linecap="round" opacity="0.86"/>
  </g>
  <text x="205" y="475" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700" opacity="0.88">Bazzi's Devlog</text>
</svg>
